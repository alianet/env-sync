name: Release validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.2-composer-
      - run: composer install --no-interaction --prefer-dist
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version in VERSION: $version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match VERSION ($version)." >&2
            exit 1
          fi
          if [[ "$(bin/env-sync --version)" != "env-sync $version" ]]; then
            echo "CLI version does not match VERSION." >&2
            exit 1
          fi
          if ! grep -Fqx "## Release v$version" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for v$version." >&2
            exit 1
          fi
      - run: composer qa
